<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8"/>
      <stop offset="100%" style="stop-color:#E8DDD0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <!-- Nav bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#FFFFFF" opacity="0.8"/>
  <text x="40" y="38" font-family="Georgia, serif" font-size="18" fill="#8B7355" font-weight="bold">MAYNU CLINICS</text>
  <text x="200" y="38" font-family="Arial, sans-serif" font-size="12" fill="#999">HOME</text>
  <text x="260" y="38" font-family="Arial, sans-serif" font-size="12" fill="#999">ABOUT US</text>
  <text x="350" y="38" font-family="Arial, sans-serif" font-size="12" fill="#999">TREATMENTS</text>
  <text x="460" y="38" font-family="Arial, sans-serif" font-size="12" fill="#999">CONTACT US</text>
  <rect x="1040" y="15" width="130" height="30" rx="4" fill="#8B7355"/>
  <text x="1060" y="35" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">BOOK APPOINTMENT</text>
  <!-- Hero section -->
  <rect x="40" y="100" width="500" height="40" rx="2" fill="#D4C5A9" opacity="0.5"/>
  <text x="40" y="150" font-family="Georgia, serif" font-size="42" fill="#3D3225" font-weight="bold">Redefining</text>
  <text x="40" y="200" font-family="Georgia, serif" font-size="42" fill="#8B7355" font-weight="bold" font-style="italic">Aesthetics.</text>
  <text x="40" y="250" font-family="Georgia, serif" font-size="42" fill="#3D3225" font-weight="bold">Restoring</text>
  <text x="40" y="300" font-family="Georgia, serif" font-size="42" fill="#3D3225" font-weight="bold">Confidence.</text>
  <text x="40" y="340" font-family="Arial, sans-serif" font-size="14" fill="#888">Advanced aesthetic treatments, personalized for</text>
  <text x="40" y="360" font-family="Arial, sans-serif" font-size="14" fill="#888">your unique beauty.</text>
  <rect x="40" y="390" width="180" height="40" rx="4" fill="#8B7355"/>
  <text x="65" y="415" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">BOOK APPOINTMENT</text>
  <!-- Decorative circles -->
  <circle cx="800" cy="300" r="200" fill="#D4C5A9" opacity="0.3"/>
  <circle cx="900" cy="250" r="150" fill="#C4B599" opacity="0.2"/>
  <!-- Features -->
  <rect x="40" y="550" width="250" height="80" rx="8" fill="#FFFFFF" opacity="0.6"/>
  <text x="70" y="585" font-family="Arial, sans-serif" font-size="12" fill="#333">Expert Dermatologists</text>
  <rect x="320" y="550" width="250" height="80" rx="8" fill="#FFFFFF" opacity="0.6"/>
  <text x="350" y="585" font-family="Arial, sans-serif" font-size="12" fill="#333">USFDA Approved</text>
  <rect x="600" y="550" width="250" height="80" rx="8" fill="#FFFFFF" opacity="0.6"/>
  <text x="630" y="585" font-family="Arial, sans-serif" font-size="12" fill="#333">Personalized Care</text>
  <rect x="880" y="550" width="250" height="80" rx="8" fill="#FFFFFF" opacity="0.6"/>
  <text x="910" y="585" font-family="Arial, sans-serif" font-size="12" fill="#333">Safe &amp; Proven</text>
  <!-- Mobile phone mockup -->
  <rect x="920" y="80" width="220" height="440" rx="20" fill="#1a1a1a" opacity="0.15"/>
  <rect x="930" y="95" width="200" height="410" rx="14" fill="#FFFFFF" opacity="0.4"/>
</svg>
